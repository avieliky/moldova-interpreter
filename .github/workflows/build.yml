name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Permissions
        run: |
          # The Docker container runs as root, but Buildozer prefers a non-root user
          # We'll adjust permissions to ensure the build can proceed
          chown -R user:user .

      - name: Build with Buildozer
        run: |
          # Run as the 'user' already present in the Kivy Docker image
          su user -c "buildozer -v android debug --yes"
        env:
          BUILDOZER_ALLOW_ORG_NAME_START_WITH_DIGIT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoldovaInterpreter-APK
          path: bin/*.apk

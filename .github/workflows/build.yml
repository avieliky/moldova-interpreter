name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev 
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev 
          libsqlite3-dev tk-dev uuid-dev libgdbm-dev liblzma-dev 
          libvulkan-dev vulkan-tools libsdl2-dev libsdl2-image-dev 
          libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Build with Buildozer
        uses: ArtemSerebrenninkov/buildozer-action@v1
        with:
          buildozer_version: master
          python_version: 3.10
          command: android debug
          repository_root: .

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MoldovaInterpreter-APK
          path: bin/*.apk

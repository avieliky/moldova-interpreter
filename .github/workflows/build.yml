name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses-dev cmake libffi-dev libssl-dev \
          libsqlite3-dev tk-dev uuid-dev libgdbm-dev liblzma-dev \
          libvulkan-dev vulkan-tools libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev openjdk-17-jdk \
          patch m4 texinfo lib32z1 lib32stdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        run: |
          # The --debug flag provides full logs if something fails
          # --yes accepts all licenses automatically
          buildozer -v android debug --yes
        env:
          # This helps with some NDK/SDK download issues in CI
          BUILDOZER_ALLOW_ORG_NAME_START_WITH_DIGIT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoldovaInterpreter-APK
          path: bin/*.apk
